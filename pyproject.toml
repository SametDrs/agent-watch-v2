[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-watch"
version = "0.1.0"
description = "Textual TUI that monitors Claude Code subagents and Gemini agy conversations"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=1.0",
    "psutil>=6.0",
]

[project.scripts]
agent-watch = "agent_watch.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
